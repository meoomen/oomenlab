# Research projects, tools, and datasets
# Each entry becomes a card on the Projects page.
# group: featured  →  shown prominently at the top
# group: (omitted) →  shown in the main list

- title: TE Regulatory Evolution
  subtitle: Tracing transposable element co-option across mammalian genomes
  group: featured
  # image: images/project-te-evolution.jpg
  description: >
    We use comparative genomic and transcriptomics approaches to trace how evolutionary ancient
    transposable element families have been co-opted as cis-regulatory elements
    over the course of mammalian evolution, revealing the rules that govern
    whether a TE becomes a host gene regulator.
  tags:
    - transposable elements
    - genome evolution
    - epigenomics

- title: TEs in Development
  subtitle: Epigenetic regulation of transposable elements during differentiation
  group: featured
  # image: images/project-te-development.jpg
  description: >
    Using mammalian stem cell differentiation models, we investigate how the
    host epigenome controls TE activity during development and how TE sequences
    feed back to shape the epigenetic landscape at nearby genes.
  tags:
    - stem cells
    - differentiation
    - chromatin

- title: TEs in Disease
  subtitle: Transposable element misregulation in cancer and other diseases
  # image: images/project-te-disease.jpg
  description: >
    TEs that escape normal epigenetic silencing can drive oncogenic gene
    expression programs. We study the mechanisms of TE misregulation in cancer
    and explore TE-derived sequences as potential biomarkers or therapeutic
    targets.
  tags:
    - cancer
    - epigenetics
    - transposable elements

