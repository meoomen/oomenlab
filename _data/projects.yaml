# Research projects, tools, and datasets
# Each entry becomes a card on the Projects page.
# group: featured  →  shown prominently at the top
# group: (omitted) →  shown in the main list

- title: TE Regulatory Evolution
  subtitle: Tracing transposable element co-option across mammalian genomes
  group: featured
  image: images/project-te-evolution.jpg
  description: >
    We use comparative genomic and transcriptomics approaches to trace how evolutionary ancient
    transposable element families have been co-opted as cis-regulatory elements
    over the course of mammalian evolution, revealing the rules that govern
    whether a TE becomes a host gene regulator.
  tags:
    - transposable elements
    - genome evolution
    - cross-species analyses

- title: TEs as regulators of the epigenome
  subtitle: Epigenetic regulation of transposable elements in stem cells and differentiation
  group: featured
  image: images/project-te-epigenome.jpg
  description: >
    Using mammalian stem cells and differentiation models, we investigate how the
    host epigenome controls TE activity and how TE sequences
    feed back to shape the epigenetic landscape of nearby genes.
  tags:
    - stem cells 
    - differentiation
    - chromatin
    - genomics

- title: TEs in their genomic context
  subtitle: Transposable element misregulation in cancer and other diseases
  image: images/project-te-genome-neighbor.jpg
  description: >
    TEs are known to drive gene expression programs in development, as well as in certain diseases such as cancer. 
    We study the mechanisms in which TE sequences wire the surrounding genome, and explore what happens to neighboring genes when TEs become (untimely) expressed. 
  tags:
    - gene regultion
    - transposable elements
    - development
    - cancer

