# Publication sources — add DOIs (or ORCID/PubMed/Google Scholar IDs) here.
# The GitHub Action will auto-fetch full metadata and write _data/citations.yaml.
#
# Quickstart: paste your DOIs one per entry, like:
#   - id: doi:10.1016/j.cell.2023.01.001
#
# To pull ALL your publications at once, add your ORCID or Google Scholar ID:
#   - id: orcid:0000-0002-2432-3862
#   - id: google-scholar:XXXXXXXXXX
#
# You can mix and match, and add optional overrides (image, buttons, tags):
#   - id: doi:10.XXXX/XXXXX
#     image: images/paper-figure.jpg
#     tags:
#       - transposable elements
#       - epigenetics
#     buttons:
#       - type: source
#         link: https://github.com/oomen-lab/paper-code

# ── Add your publications below ──────────────────────────────────────────────

# Example (replace with your actual DOIs):
# - id: doi:10.1038/s41588-023-01234-5
# - id: doi:10.1016/j.celrep.2022.110000
# - id: doi:10.1093/nar/gkab000

#Or use your ORCID to import everything automatically (recommended):
- id: orcid:0000-0002-2432-3862
